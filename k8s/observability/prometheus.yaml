apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sdet-poc
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: order-service
        metrics_path: /actuator/prometheus
        basic_auth:
          username_file: /etc/prometheus/secrets/SECURITY_USERNAME
          password_file: /etc/prometheus/secrets/SECURITY_PASSWORD
        static_configs:
          - targets: ["order-service:8080"]

      - job_name: inventory-service
        metrics_path: /actuator/prometheus
        basic_auth:
          username_file: /etc/prometheus/secrets/SECURITY_USERNAME
          password_file: /etc/prometheus/secrets/SECURITY_PASSWORD
        static_configs:
          - targets: ["inventory-service:8081"]
