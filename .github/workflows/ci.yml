name: SDET CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  DB_NAME: orders_db
  DB_USERNAME: orders_user
  DB_PASSWORD: ci_db_password
  SECURITY_USERNAME: sdet
  SECURITY_PASSWORD: sdet123

jobs:
  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build service JARs
        run: |
          mvn --batch-mode -f services/order-service/pom.xml -DskipTests package
          mvn --batch-mode -f services/inventory-service/pom.xml -DskipTests package

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for Order Service
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              echo "Order Service is healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Run API tests
        working-directory: automation/api-tests
        run: mvn --batch-mode test "-Dapi.username=${SECURITY_USERNAME}" "-Dapi.password=${SECURITY_PASSWORD}" "-DbaseUrl=http://localhost:8080"

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: automation/api-tests/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop application stack
        if: always()
        run: docker compose down -v

  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/ui-tests/package-lock.json

      - name: Build service JARs
        run: |
          mvn --batch-mode -f services/order-service/pom.xml -DskipTests package
          mvn --batch-mode -f services/inventory-service/pom.xml -DskipTests package

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for Order Service
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              echo "Order Service is healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Install dependencies
        working-directory: automation/ui-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: automation/ui-tests
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: automation/ui-tests
        env:
          BASE_URL: http://localhost:8080
          API_USERNAME: ${{ env.SECURITY_USERNAME }}
          API_PASSWORD: ${{ env.SECURITY_PASSWORD }}
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation/ui-tests/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop application stack
        if: always()
        run: docker compose down -v
