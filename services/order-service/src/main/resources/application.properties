spring.datasource.url=jdbc:postgresql://postgres:5432/orders_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8081}
security.username=${SECURITY_USERNAME}
security.password=${SECURITY_PASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=orderCreatedEvent:com.example.order.event.OrderCreatedEvent
