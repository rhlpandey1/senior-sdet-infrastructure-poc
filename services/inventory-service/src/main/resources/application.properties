server.port=8081

spring.datasource.url=jdbc:postgresql://postgres:5432/orders_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
security.username=${SECURITY_USERNAME}
security.password=${SECURITY_PASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.inventory.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.inventory.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Observability: expose health and Prometheus metrics endpoints
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
